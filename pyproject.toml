[project]
name = "opendryfire"
version = "0.1.0"
description = "Webcam laser-hit scoring for dry fire practice, with acoustic shot timing"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["dry-fire", "marksmanship", "shooting-range", "opencv", "shot-timer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    # macOS only. Used for camera enumeration by name and for reading/
    # disabling Continuity Camera video effects. devices.py imports it
    # defensively and falls back to system_profiler, then to plain device
    # indices, so other platforms lose naming but keep working.
    "pyobjc-framework-avfoundation>=12.2.2; sys_platform == 'darwin'",
    "reportlab>=5.0.0",
    "scipy>=1.18.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
# The package is opendryfire; the command stays short, because it is
# typed constantly and the brand belongs on the package.
dryfire = "opendryfire.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendryfire"]
artifacts = ["src/opendryfire/plans/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
