# A dry fire plan: which target setups exist, and which blocks to run on them.
#
# Copy this file, edit it, and point opendryfire at it:
#     dryfire --plan my-plan.toml run F15
# or save it as ~/.dryfire/plan.toml to make it the default.
#
# This particular plan is a 26-week pistol program built around scaled targets
# and a low round count. It is included as a worked example — the blocks below
# are one person's programme, not a recommendation. Write your own.

name = "Lean Track"
description = "26-week pistol program: scaled targets, 4x15min dry fire per week"

# ---------------------------------------------------------------------------
# Setups: a printed target at a scale, stood at a distance.
#
# The simulated distance is *derived* from scale and distance, never written
# here, so the two can never disagree:
#     simulated_yards = (stand_distance_ft / 3) / scale
# A 1/5 scale target at 9 ft subtends the same angle as a full one at 15 yards.
# ---------------------------------------------------------------------------

[[setups]]
key = "b-draw"
target = "uspsa"          # built-in: "uspsa" or "b8"
scale_denominator = 3     # 1/3 scale
stand_distance_ft = 7.0   # => 7 yd equivalent

[[setups]]
key = "test"
target = "uspsa"
scale_denominator = 3
stand_distance_ft = 10.0  # => 10 yd equivalent

[[setups]]
key = "f-15"
target = "uspsa"
scale_denominator = 5
stand_distance_ft = 9.0   # => 15 yd equivalent

[[setups]]
key = "f-25"
target = "uspsa"
scale_denominator = 5
stand_distance_ft = 15.0  # => 25 yd equivalent

# ---------------------------------------------------------------------------
# Blocks: what you actually run.
#
#   timed        = false means no par time is imposed, and `run` refuses to add
#                  one unless you pass --timer.
#   ladder       = true enables automatic par reduction (see clean_to_advance).
# ---------------------------------------------------------------------------

[[blocks]]
key = "B"
name = "Draw to First Shot (par ladder)"
setup = "b-draw"
timed = true
ladder = true
start_par = 2.5
target_par = 1.6
par_step = 0.1
clean_to_advance = 8
of_reps = 10
reps = 10
guidance = """
From concealment. The sight picture is the gate, not the beep — never chase a \
par your sights cannot support."""

[[blocks]]
key = "D"
name = "Transitions"
setup = "b-draw"
timed = true
start_par = 1.5
target_par = 0.8
reps = 10
guidance = """
Two targets, one round each. The error to hunt: driving the gun first and \
dragging your eyes behind it."""
warning = """
A striker-fired pistol needs a slide rack between presses, so the raw split \
includes the rack. Rack time is measured and reported separately; the \
transition figure is repeatable but is not a true live-fire split."""

[[blocks]]
key = "F15"
name = "Distance Refinement — 15 yd equivalent"
setup = "f-15"
timed = true
start_par = 2.5
target_par = 0.8
reps = 10
minutes = 5
guidance = """
From concealment. The sight picture is the gate, not the beep — never chase a \
par your sights cannot support."""
warning = """
Untimed by design: at distance the clock hides the error you came to find. \
Add a par only after a month of untimed work, and only at the 15 yd mark."""

[[blocks]]
key = "F25"
name = "Distance Refinement — 25 yd equivalent"
setup = "f-25"
timed = false
reps = 10
minutes = 5
guidance = "10 presentations, last 5 strong-hand-only."
warning = "Untimed. Never add a par at the 25 yd mark."

[[blocks]]
key = "TEST"
name = "The Test (dry equivalent)"
setup = "test"
timed = true
start_par = 10.0
reps = 10
guidance = "10 shots, 10 seconds, 10 yards."
